<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="500" height="200">
  <defs>
    <!-- Car Body Gradient -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7e5f" />
      <stop offset="100%" stop-color="#feb47b" />
    </linearGradient>
    
    <!-- Neon Highlights -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffd0b0" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glass / Windows Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050505" />
      <stop offset="50%" stop-color="#111" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow">
      <feDropShadow dx="-10" dy="15" stdDeviation="15" flood-color="#000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Wheels -->
    <!-- Rear Left -->
    <rect x="70" y="10" width="75" height="40" rx="8" fill="#0a0a0a" />
    <!-- Front Left -->
    <rect x="360" y="10" width="65" height="35" rx="8" fill="#0a0a0a" />
    <!-- Rear Right -->
    <rect x="70" y="150" width="75" height="40" rx="8" fill="#0a0a0a" />
    <!-- Front Right -->
    <rect x="360" y="155" width="65" height="35" rx="8" fill="#0a0a0a" />

    <!-- Main Chassis / Body -->
    <path d="M 40,55 L 440,55 C 475,55 490,75 490,100 C 490,125 475,145 440,145 L 40,145 C 15,145 5,125 5,100 C 5,75 15,55 40,55 Z" fill="url(#bodyGrad)" />
    
    <!-- Aerodynamic Side Skirts -->
    <path d="M 150,50 L 350,50 C 360,50 365,53 365,55 L 140,55 Z" fill="url(#neonGrad)" />
    <path d="M 150,150 L 350,150 C 360,150 365,147 365,145 L 140,145 Z" fill="url(#neonGrad)" />

    <!-- Cabin / Windows (Top-down view) -->
    <!-- Windshield & Roof -->
    <path d="M 160,65 L 340,70 C 370,70 385,85 385,100 C 385,115 370,130 340,130 L 160,135 C 120,135 105,115 105,100 C 105,85 120,65 160,65 Z" fill="url(#glassGrad)" stroke="#222" stroke-width="2" />
    
    <!-- Engine Cover (Rear) -->
    <path d="M 40,70 L 105,70 L 105,130 L 40,130 Z" fill="#111" />
    <!-- Engine Vents -->
    <rect x="50" y="75" width="50" height="5" fill="#333" />
    <rect x="50" y="85" width="50" height="5" fill="#333" />
    <rect x="50" y="110" width="50" height="5" fill="#333" />
    <rect x="50" y="120" width="50" height="5" fill="#333" />

    <!-- Headlights -->
    <path d="M 460,60 L 480,65 L 450,70 Z" fill="#fff" filter="url(#glow)" />
    <path d="M 460,140 L 480,135 L 450,130 Z" fill="#fff" filter="url(#glow)" />
    
    <!-- Taillights -->
    <path d="M 10,60 L 25,60 L 25,70 Z" fill="#f00" filter="url(#glow)" />
    <path d="M 10,140 L 25,140 L 25,130 Z" fill="#f00" filter="url(#glow)" />

    <!-- Rear Spoiler -->
    <path d="M 15,40 L 40,40 L 40,160 L 15,160 Z" fill="#111" />
  </g>
</svg>
